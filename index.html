<!doctype html>
<html lang="en" data-theme="sunset_orange" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitMood — Your Personal Home Fitness & Wellness Coach</title>
    <meta name="description" content="Build your body. Boost your mood. No gym. No expensive equipment." />
    <meta property="og:title" content="FitMood — Your Personal Home Fitness & Wellness Coach" />
    <meta property="og:description" content="Build your body. Boost your mood. No gym. No expensive equipment." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400..900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('fitmood_active_theme');
          var savedMode = localStorage.getItem('fitmood_active_mode');
          var validThemes = ['sunset_orange', 'light', 'dark', 'ocean_blue', 'forest_green', 'lavender'];
          var t = (savedTheme && validThemes.indexOf(savedTheme) !== -1) ? savedTheme : 'sunset_orange';
          var m = (savedMode === 'light' || savedMode === 'dark') ? savedMode : 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-mode', m);
          if (m === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen selection:bg-orange-500 selection:text-white" style="background-color: var(--app-bg); color: var(--app-text-primary);">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
